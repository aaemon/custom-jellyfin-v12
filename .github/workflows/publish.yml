name: Publish Custom Navbar Jellyfin

on:
  push:
    branches:
      - main
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-custom-navbar
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Read latest upstream version
        id: upstream
        shell: bash
        run: |
          set -Eeuo pipefail
          docker pull ghcr.io/jellyfin/jellyfin:latest
          version=$(docker image inspect ghcr.io/jellyfin/jellyfin:latest --format '{{index .Config.Labels "org.opencontainers.image.version"}}')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the base image is available
        id: base
        shell: bash
        run: |
          set -Eeuo pipefail
          base_image="ghcr.io/aaemon/cusom-jellyfin-v12:${{ steps.upstream.outputs.version }}"
          manifest=$(docker buildx imagetools inspect --raw "$base_image" 2>/dev/null || true)
          if [[ -n "$manifest" ]] && jq -e '
            [ .manifests[]? | .platform? // empty
              | select(.os == "linux" and (.architecture == "amd64" or .architecture == "arm64"))
              | .architecture
            ] | index("amd64") != null and index("arm64") != null
          ' <<<"$manifest" >/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Base image is not available for both required architectures: $base_image" >&2
          fi

      - name: Check whether both architectures are published
        id: existing
        shell: bash
        run: |
          set -Eeuo pipefail
          image="ghcr.io/${{ github.repository }}:${{ steps.upstream.outputs.version }}"
          manifest=$(docker buildx imagetools inspect --raw "$image" 2>/dev/null || true)
          if [[ -n "$manifest" ]] && jq -e '
            [ .manifests[]? | .platform? // empty
              | select(.os == "linux" and (.architecture == "amd64" or .architecture == "arm64"))
              | .architecture
            ] | index("amd64") != null and index("arm64") != null
          ' <<<"$manifest" >/dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v4
        if: steps.existing.outputs.publish == 'true' && steps.base.outputs.available == 'true'
        with:
          platforms: arm64

      - uses: docker/build-push-action@v7
        if: steps.existing.outputs.publish == 'true' && steps.base.outputs.available == 'true'
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            JELLYFIN_VERSION=${{ steps.upstream.outputs.version }}
            JELLYFIN_BASE_IMAGE=ghcr.io/aaemon/cusom-jellyfin-v12:${{ steps.upstream.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.upstream.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

      - name: Report result
        shell: bash
        run: |
          if [[ '${{ steps.base.outputs.available }}' != 'true' ]]; then
            echo 'The upstream version has no matching base image yet; nothing was published.'
          elif [[ '${{ steps.existing.outputs.publish }}' == 'true' ]]; then
            echo 'Published navbar image for Jellyfin ${{ steps.upstream.outputs.version }}.'
          else
            echo 'Navbar image for Jellyfin ${{ steps.upstream.outputs.version }} was already published.'
          fi
